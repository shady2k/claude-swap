name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # uv (not pip) so the PEP 735 dev dependency-group — pytest,
      # pytest-asyncio — installs from the committed lockfile, same as local
      # development.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Install isolated stand tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 openssl strace util-linux

      - name: Run isolated Linux stand and shim latency check
        # Use a fresh runner-owned source and venv with permissions accepted
        # by the shim. The stand uses sudo only to set up its namespaces.
        run: |
          set -o pipefail
          umask 022
          stand=$(mktemp -d /tmp/cswap-stand.XXXXXXXX)
          trap 'rm -rf -- "$stand"' EXIT
          mkdir "$stand/source"
          git -c tar.umask=0022 archive HEAD | tar -x -C "$stand/source"
          cd "$stand/source"
          UV_CACHE_DIR="$stand/cache" UV_PYTHON_INSTALL_DIR="$stand/python" \
            uv sync --locked --managed-python --python 3.12
          CSWAP_TEST_SHIM_LATENCY=1 .venv/bin/python -m pytest -n 0 -s -q \
            tests/test_transparent.py::test_f4_only_shim_and_explicit_shim_refuse_without_recursion
          CSWAP_TEST_STAND=1 CSWAP_TEST_STAND_REQUIRED=1 CSWAP_STAND_SUDO=1 \
            CSWAP_STAND_RUN_AS="$(id -u):$(id -g)" \
            .venv/bin/python -m pytest -n 0 -vv -p tests.required_stand \
              tests/test_stand_linux.py tests/test_stand_mock_linux.py tests/test_stand_shim_linux.py

  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Check legacy executable identity on the venv Python
        run: uv run python -m tests.win_handoff_diagnostic

      - name: Diagnose policy lookup in an isolated Windows profile
        run: uv run python -m tests.win_config_diagnostic

      - name: Run tests
        # Includes the TUI tests: the Textual TUI (unlike the old curses one)
        # runs on stock Windows, and this job is the proof.
        run: uv run pytest -rs

  # The id stays `macos-keychain` although the job now runs everything: it is
  # the name branch protection matches on, and renaming it silently drops the
  # required check.
  macos-keychain:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies with a managed Python
        # Keep the whole interpreter chain out of the runner's system Python
        # tree. The shim rejects group-writable ancestors on any install.
        shell: bash
        run: |
          umask 022
          export UV_PYTHON_INSTALL_DIR="$(mktemp -d "$RUNNER_TEMP/cswap-python.XXXXXXXX")"
          uv sync --locked --managed-python --python 3.12
          .venv/bin/python -I -c '
          import os, sys
          from pathlib import Path
          from claude_swap.python_chain import check_python_chain

          assert Path(sys.base_prefix).resolve().is_relative_to(
              Path(os.environ["UV_PYTHON_INSTALL_DIR"]).resolve()
          ), "venv is not using the job-managed Python"
          check_python_chain()
          '

      - name: Diagnose audited startup on the managed Python
        run: .venv/bin/python -m tests.stand_startup_diagnostic

      - name: Run the whole suite (not only the Keychain files)
        # THE NARROW SELECTION WAS A BLIND SPOT, not a saving. Three cases
        # failed on macOS -- one asserting the Linux XDG layout, two because a
        # usable Keychain takes the write and leaves no `.enc` to chmod --
        # while every job stayed green, because this job never ran them. A merge that
        # restores a two-file selection here re-opens that hole invisibly:
        # those cases pass now, they would simply stop running.
        #
        # faulthandler dumps every thread's stack past the budget, the only
        # clue when a `security` call blocks on an invisible SecurityAgent
        # dialog. While pyproject sets no faulthandler keys this `-o` is the
        # only thing setting the budget and the dump does not abort; PR 287
        # adds them repo-wide at the same 600, after which this is a no-op
        # and the dump aborts the worker. `timeout-minutes` is the backstop
        # that holds under either ordering.
        timeout-minutes: 15
        run: .venv/bin/python -m pytest -rs -o faulthandler_timeout=600
